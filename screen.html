<!DOCTYPE html>
<!--
  screen.html — 외부 송출 화면

  역할:
    예배 현장에서 프로젝터나 두 번째 모니터에 표시되는 슬라이드 출력 화면.
    조작창(index.html)과는 Electron IPC로 통신하며 슬라이드 데이터를 수신한다.
    외부 모니터가 여럿이면 모니터마다 이 화면이 하나씩 열려 같은 슬라이드를 각자 그린다.
    (화면 자르기는 송출 화면마다 따로 받는다. 소리는 기준 송출 화면 하나만 낸다 — main.js)

  주요 기능:
    - 가사 + 배경 이미지/영상 표시
    - 슬라이드 전환 시 크로스페이드(A/B 레이어 교차)
    - 블랙아웃(화면 암전) 처리
    - 화면 자르기 (조작창 프로젝터 설정: 가장자리를 잘라 내거나, 남은 곳에 슬라이드를 줄여 넣기)
    - 크로마키(배경색 치환) 지원
    - 키보드로 슬라이드 이동 조작 가능 (이벤트는 index.html로 전달)
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
/* 구글 웹폰트: 예배 가사용 명조/고딕 폰트 */
/* 편집창(index.html)과 같은 폰트·굵기 목록을 불러와야 글자 두께가 똑같이 보인다 */
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@300;400;500;600&family=Black+Han+Sans&family=Nanum+Gothic:wght@400;700;800&family=Nanum+Myeongjo:wght@400;700&family=Nanum+Pen+Script&display=swap');

/* 전체 리셋: 여백 제거, 100% 크기 고정 */
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100vw;height:100vh;overflow:hidden;background:#000;cursor:none;}
body{position:relative;}

/*
  #view — 송출 화면에 실제로 보이는 곳 (화면 자르기에서 남긴 곳)
  창 안의 슬라이드 자리에서 조작창의 프로젝터 설정에 맞춰 위·아래·왼쪽·오른쪽을 잘라 낸 사각형.
  밖은 검게 남고, 무대·암전·마커 선은 모두 이 안에서만 보인다. 위치·크기는 fitStage()가 정한다.
*/
#view{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;}

/*
  #stage — 고정 1920×1080 무대
  모든 슬라이드를 항상 1920×1080 기준으로 그린 뒤, 실제 모니터 크기에 맞게 통째로 확대/축소한다.
  → 모니터 해상도·비율과 상관없이 글자 크기·두께·줄바꿈이 편집 미리보기와 똑같은 비율로 보인다.
  --k: 편집창의 editorScale과 같은 의미의 배율 (1080/(1080/1.4) = 1.4)
*/
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;--k:1.4;}

/*
  A/B 레이어 — 크로스페이드를 위한 이중 레이어 구조
  슬라이드 전환 시 한 레이어가 나타나고 다른 레이어가 사라지는 방식으로 부드럽게 전환된다.
  #LA: 현재 표시 레이어 (z-index: 2, 불투명)
  #LB: 다음 슬라이드를 미리 그리는 레이어 (z-index: 1, 투명)
  배경색은 fillL이 레이어 맨 아래의 .bgc(#BGA/#BGB)에 설정한다 — 페이드할 때 배경색도 사진·영상·글자와 함께
  하나씩 투명해지게 하려고 레이어 자체가 아닌 자식에 둔다 (applySlide 참고)
*/
#LA,#LB{position:absolute;inset:0;transition:opacity var(--fd,0s) ease-in-out;}
#LA{opacity:1;z-index:2;}
#LB{opacity:0;z-index:1;}
.bgc{position:absolute;inset:0;}

/*
  .ml — 미디어 레이어 (배경 이미지 / 영상)
  이미지와 영상은 object-fit:cover로 화면에 꽉 채운다.
*/
.ml{position:absolute;inset:0;overflow:hidden;}
/* #GBG — 그룹 배경 영상 레이어 (groupBgLayer.js). 두 레이어 아래에서 하나의 영상을 이어서 재생 */
#GBG{position:absolute;inset:0;overflow:hidden;pointer-events:none;opacity:0;z-index:0;}
.ml img,.ml video{position:absolute;object-fit:cover;display:block;max-width:none;max-height:none;}

/* .ov — 색상 오버레이 레이어 (현재 미사용, 확장용) */
.ov{position:absolute;inset:0;}

/* ── 크로마키 모드 (레이어별) ──
   레이어(#LA/#LB)에 .ck-on 클래스가 붙으면 그 레이어의 미디어·오버레이·그림자가 제거된다.
   배경색은 레이어의 .bgc에 직접 설정되어 A/B 크로스페이드와 함께 부드럽게 전환된다.
   (body 전역이 아니라 레이어별로 적용해야 크로마키 ↔ 일반/다른 크로마키 전환 시에도 페이드가 동작) */
#LA.ck-on .ml img,#LA.ck-on .ml video,
#LB.ck-on .ml img,#LB.ck-on .ml video{display:none!important;}
#LA.ck-on .ov,#LB.ck-on .ov{display:none!important;}
#LA.ck-on .ly,#LB.ck-on .ly{text-shadow:none!important;}
#LA.ck-on .etb,#LB.ck-on .etb{text-shadow:none!important;}


/*
  .tl — 텍스트 레이어 (가사 표시 컨테이너)
  레이아웃 타입에 따라 정렬 방식이 달라진다:
    centerLyrics  : 화면 중앙
    bottomCaption : 화면 하단
    titleAndBody  : 왼쪽 정렬
    scripture     : 중앙, 성경 구절 스타일
    fullBackground: 하단 오버레이
  .manual-pos: CSS 변수(--tx, --ty)로 위치를 픽셀 단위 대신 % 단위로 제어
*/
/* ※ 아래 규칙은 편집창(index.html)의 .ltxt/.llyr/.lsub 규칙과 1:1로 같아야 한다.
     px 값은 calc(Npx*var(--k))로 써서 편집창 미리보기와 같은 비율을 유지한다. */
.tl{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:2;pointer-events:none;}
/* 수동 위치 모드: CSS 변수 --tx, --ty 로 X/Y 위치 제어 */
.tl.manual-pos{left:var(--tx,50%);top:var(--ty,50%);right:auto;bottom:auto;width:max-content;max-width:88%;height:auto;min-width:calc(120px*var(--k));transform:translate(-50%,var(--ty-anc,-50%));padding:0;overflow:visible;}
.tl.manual-pos.layout-titleAndBody{align-items:flex-start;text-align:left;width:min(calc(760px*var(--k)),86%);}
.tl.manual-pos.layout-scripture{width:min(calc(760px*var(--k)),86%);}

/* .ly — 가사 텍스트 */
.ly{font-weight:700;color:#fff;line-height:1.75;white-space:pre-wrap;word-break:keep-all;}
.tl.layout-bottomCaption .ly{line-height:1.55;background:rgba(0,0,0,.42);padding:calc(10px*var(--k)) calc(22px*var(--k));border-radius:calc(10px*var(--k));max-width:92%;}
.tl.layout-titleAndBody .ly{font-weight:500;line-height:1.7;max-width:86%;}
.tl.layout-scripture .ly{font-family:'Noto Serif KR',serif;font-weight:500;line-height:1.95;max-width:86%;}
.tl.layout-fullBackground .ly{font-size:.9em;line-height:1.55;background:rgba(0,0,0,.34);padding:calc(8px*var(--k)) calc(18px*var(--k));border-radius:999px;max-width:90%;}

/* .sb — 소제목 (번역문, 성경 구절 출처 등) */
.sb{margin-top:calc(10px*var(--k));color:rgba(255,255,255,.4);font-family:'Noto Sans KR',sans-serif;font-weight:300;letter-spacing:calc(1px*var(--k));}
.tl.layout-titleAndBody .sb{order:-1;margin-top:0;margin-bottom:calc(14px*var(--k));color:#fff;font-weight:700;letter-spacing:0;font-size:calc(24px*var(--k))!important;}
.tl.layout-scripture .sb{margin-top:calc(18px*var(--k));color:rgba(255,255,255,.55);}
.tl.layout-fullBackground .sb{display:none;}

/* #pbar — 자동재생 진행 바 (화면 하단, 보라색) */
#pbar{position:absolute;bottom:0;left:0;height:4px;background:rgba(124,107,255,.8);width:0;z-index:10;display:none;}

/* .etl / .etb — 추가 텍스트 박스 레이어 (번역문, 곡 정보 등) */
.etl{position:absolute;inset:0;pointer-events:none;}
/* 편집창 .extraTextBox와 동일 (nowrap 박스 + pre-wrap span, 여백/최소너비는 --k 배율) */
.etb{position:absolute;text-align:center;line-height:1.6;font-weight:600;white-space:nowrap;word-break:keep-all;overflow:visible;box-sizing:border-box;display:flex;align-items:center;padding:calc(4px*var(--k)) calc(8px*var(--k));min-width:calc(80px*var(--k));}

/*
  #presOvl — 발표자 모드 오버레이
  현재 슬라이드와 다음 슬라이드를 반투명 오버레이로 보여준다.
  mode='pres'일 때만 표시된다.
*/
#presOvl{display:none;position:absolute;inset:0;background:rgba(0,0,0,.85);flex-direction:column;align-items:center;justify-content:center;gap:24px;z-index:20;}
#presOvl.show{display:flex;}
#presCur{color:#fff;font-family:'Noto Serif KR',serif;font-size:36px;text-align:center;padding:0 40px;white-space:pre-wrap;word-break:keep-all;}
#presLbl{color:rgba(255,255,255,.4);font-size:13px;font-family:'Noto Sans KR',sans-serif;}
#presNxt{color:rgba(255,255,255,.7);font-family:'Noto Serif KR',serif;font-size:22px;text-align:center;border-top:1px solid rgba(255,255,255,.1);padding:16px 40px 0;white-space:pre-wrap;word-break:keep-all;}

/* #blankOvl — 블랙아웃 오버레이 (블랙아웃 ON 시 화면 전체를 검은색으로 덮음) */
#blankOvl{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .4s ease;z-index:50;pointer-events:none;}

/* #markerLine — 위치 마커 선 (보이는 슬라이드의 오른쪽 끝에 부착된 흰색 가로선, 자리는 _placeMarkerLine) */
#markerLine{position:absolute;right:0;width:48px;height:2px;background:#fff;z-index:15;display:none;pointer-events:none;box-shadow:0 0 6px rgba(255,255,255,.5);}
</style>
</head>
<body>

<!--
  A 레이어 (#LA): 기본 표시 레이어
  내부 구성:
    #MA — 배경 미디어(이미지/영상)
    #OA — 색상 오버레이
    #TWA — 가사 텍스트 컨테이너 (#TA: 가사, #SA: 소제목)
    #XA — 추가 텍스트 박스들
-->
<!-- 보이는 곳: 화면 자르기에서 남긴 곳. 밖은 검게 남는다 -->
<div id="view">
<!-- 고정 1920×1080 무대: 창 크기에 맞춰 fitStage()가 통째로 확대/축소한다 -->
<div id="stage">
<div id="LA">
  <div class="bgc" id="BGA"></div>
  <div class="ml" id="MA"></div>
  <div class="ov" id="OA"></div>
  <div class="tl layout-centerLyrics manual-pos" id="TWA">
    <div class="ly" id="TA"></div>
    <div class="sb" id="SA"></div>
  </div>
  <div class="etl" id="XA"></div>
</div>

<!-- B 레이어 (#LB): 크로스페이드용 예비 레이어 (초기에는 투명) -->
<div id="LB">
  <div class="bgc" id="BGB"></div>
  <div class="ml" id="MB"></div>
  <div class="ov" id="OB"></div>
  <div class="tl layout-centerLyrics manual-pos" id="TWB">
    <div class="ly" id="TB"></div>
    <div class="sb" id="SB"></div>
  </div>
  <div class="etl" id="XB"></div>
</div>
<div id="GBG"></div>
</div>

<!-- 자동재생 진행 바 (width가 0→100%로 채워지는 애니메이션) -->
<div id="pbar"></div>

<!-- 발표자 모드 오버레이 (현재 슬라이드 + 다음 슬라이드 미리보기) -->
<div id="presOvl">
  <div id="presCur"></div>
  <div id="presLbl">다음 슬라이드</div>
  <div id="presNxt"></div>
</div>

<!-- 블랙아웃 오버레이 (opacity 0↔1 전환으로 암전 효과) -->
<div id="blankOvl"></div>

<!-- 위치 마커 선 (보이는 슬라이드의 오른쪽 끝 고정, 위아래로만 이동) -->
<div id="markerLine"></div>
</div>

<script src="videoLoop.js"></script>
<script src="groupBgLayer.js"></script>
<script>
// ─── 텍스트 그림자 효과 ─────────────────────────────────────
// 텍스트에 적용하는 그림자 CSS 문자열을 계산한다.
// 편집 미리보기 화면(index.html)과 송출 화면이 항상 동일한 그림자를
// 쓰도록 모든 렌더 경로가 이 함수 하나만 호출한다. (index.html에도 동일 함수 존재)
//   enabled   - false면 그림자 없음
//   intensity - 0~100 그림자 강도. 값이 클수록 진하다.
//   scale     - 화면 배율. 송출 무대는 항상 STAGE_K(1.4)
function computeTextShadowCSS(enabled, intensity, scale){
  if(enabled === false) return 'none'
  const si = Math.max(0, Math.min(1, (intensity != null ? intensity : 80) / 100))
  if(si <= 0) return 'none'
  const k = (scale > 0) ? scale : 1
  const r = v => +(v * k).toFixed(2)
  const blur1 = r(24 * si)
  const op1   = Math.min(1, 1.0 * si).toFixed(2)
  const blur2 = r(7 * si)
  const op2   = Math.min(1, 0.9 * si).toFixed(2)
  return `0 ${r(2)}px ${blur1}px rgba(0,0,0,${op1}), 0 ${r(1)}px ${blur2}px rgba(0,0,0,${op2})`
}

// ─── 고정 무대(1920×1080) 맞춤 ─────────────────────────────
// 편집창은 미리보기 높이/(1080/1.4) 배율(editorScale)로 그리고,
// 송출은 1920×1080 무대에 배율 1.4로 그린 뒤 창 크기에 맞춰 통째로 축소/확대한다.
// 그래서 모니터 해상도가 달라도 글자 크기·두께·줄바꿈 비율이 미리보기와 같다.
// 16:9가 아닌 화면에서는 비율을 지키기 위해 위아래/좌우에 검은 여백이 생긴다.
//
// 무대의 위치·크기는 실제 화면 픽셀 경계에 딱 맞춘다.
// 가장자리가 픽셀 중간에 걸리면 크로스페이드 동안 사라지는 레이어와 나타나는 레이어의 끝 한 줄이
// 각자 반투명하게 겹쳐 그려져, 나타날 화면이 가장자리 한 줄에만 먼저 비쳐 보인다.
// (예: 1920×1032 창이면 무대 폭이 1834.67px → 오른쪽 끝 열이 페이드 시작과 함께 바뀜)
// 가로·세로를 각각 정수 픽셀로 맞추므로 비율 차이는 2px 이하라 눈에 띄지 않는다.
//
// 화면 자르기(_crop): 슬라이드 자리에서 위·아래·왼쪽·오른쪽을 슬라이드 크기의 %만큼 잘라 낸 곳만 보인다(#view).
//   잘라 내기(fit=false): 슬라이드는 제자리 그대로, 잘린 가장자리만 검게 → 스크린 밖·가려진 곳에 빛이 가지 않게
//   줄여 넣기(fit=true) : 슬라이드 전체를 남은 곳 안에 맞게 줄인다 → 글자가 잘리지 않는다
//   크기(z, %)        : 그다음 남은 곳 가운데를 기준으로 무대를 확대·축소한다 (넘치면 잘리고, 작으면 둘레가 검다)
//   위치(x, y, %)     : 마지막으로 무대를 슬라이드 자리 크기의 %만큼 옮긴다 (+는 오른쪽·아래)
// 남은 곳의 가장자리도 정수 화면 픽셀에 맞춘다. PPT 캡처 창은 자르기를 받지 않으므로 늘 그대로다.
const STAGE_W = 1920, STAGE_H = 1080, STAGE_K = 1.4
const CROP_MAX_PAIR = 90   // 마주 보는 두 쪽(위+아래, 왼쪽+오른쪽)을 합쳐 자를 수 있는 최대 % (적어도 10%는 남긴다)
let _crop = { t: 0, r: 0, b: 0, l: 0, fit: false, z: 100, x: 0, y: 0 }
let _stageBox = null  // 보이는 곳(#view) 안에서 무대가 놓인 자리 (화면 픽셀): { x, y, w, h, vw, vh, dpr }

/** 받은 자르기 값을 검사한다. 이상한 값은 0(크기는 100), 마주 보는 두 쪽의 합이 90%를 넘으면 비율대로 줄인다 */
function _cleanCrop(c){
  const pct = v => { const n = Number(v); return Number.isFinite(n) ? Math.max(0, Math.min(CROP_MAX_PAIR, n)) : 0 }
  const o = (c && typeof c === 'object') ? c : {}
  const z = Number(o.z)
  const pos = v => { const n = Number(v); return Number.isFinite(n) ? Math.max(-50, Math.min(50, n)) : 0 }
  const r = { t: pct(o.t), r: pct(o.r), b: pct(o.b), l: pct(o.l), fit: o.fit === true,
    z: Number.isFinite(z) && o.z != null ? Math.max(50, Math.min(200, z)) : 100, x: pos(o.x), y: pos(o.y) }
  ;[['t', 'b'], ['l', 'r']].forEach(([a, b]) => {
    const sum = r[a] + r[b]
    if (sum > CROP_MAX_PAIR) { r[a] *= CROP_MAX_PAIR / sum; r[b] *= CROP_MAX_PAIR / sum }
  })
  return r
}

function fitStage(){
  const st = document.getElementById('stage'), view = document.getElementById('view')
  if(!st || !view) return
  const dpr = window.devicePixelRatio || 1
  const vv = window.visualViewport
  const Wd = Math.round((vv ? vv.width : window.innerWidth) * dpr)   // 창 크기 (화면 픽셀)
  const Hd = Math.round((vv ? vv.height : window.innerHeight) * dpr)
  const sc = Math.min(Wd / STAGE_W, Hd / STAGE_H)
  // 슬라이드 자리 (정수 화면 픽셀). 창과 2px 이하로만 차이 나면 창에 꽉 채워 끝에 1px 검은 줄이 남지 않게 한다
  let w = Math.round(STAGE_W * sc), h = Math.round(STAGE_H * sc)
  if (Wd - w <= 2) w = Wd
  if (Hd - h <= 2) h = Hd
  const ox = Math.floor((Wd - w) / 2), oy = Math.floor((Hd - h) / 2)
  // 보이는 곳: 슬라이드 자리에서 자른 만큼 뺀 사각형
  const c = _crop
  const vx = ox + Math.round(w * c.l / 100), vy = oy + Math.round(h * c.t / 100)
  const vw = Math.max(1, ox + w - Math.round(w * c.r / 100) - vx)
  const vh = Math.max(1, oy + h - Math.round(h * c.b / 100) - vy)
  view.style.left = (vx / dpr) + 'px'
  view.style.top = (vy / dpr) + 'px'
  view.style.width = (vw / dpr) + 'px'
  view.style.height = (vh / dpr) + 'px'
  // 무대 자리 (보이는 곳 기준)
  let sx = ox - vx, sy = oy - vy, sw = w, sh = h
  if (c.fit && (vw !== w || vh !== h)) {
    const s2 = Math.min(vw / STAGE_W, vh / STAGE_H)
    sw = Math.round(STAGE_W * s2); sh = Math.round(STAGE_H * s2)
    if (vw - sw <= 2) sw = vw
    if (vh - sh <= 2) sh = vh
    sx = Math.floor((vw - sw) / 2); sy = Math.floor((vh - sh) / 2)
  }
  // 크기: 보이는 곳 가운데를 기준으로 확대·축소 (가장자리는 정수 화면 픽셀에)
  if (c.z !== 100) {
    const z = c.z / 100, cx = vw / 2, cy = vh / 2
    const x0 = Math.round(cx - (cx - sx) * z), y0 = Math.round(cy - (cy - sy) * z)
    const x1 = Math.round(cx - (cx - sx - sw) * z), y1 = Math.round(cy - (cy - sy - sh) * z)
    sx = x0; sy = y0; sw = Math.max(1, x1 - x0); sh = Math.max(1, y1 - y0)
  }
  // 위치: 슬라이드 자리 크기의 %만큼 옮긴다
  sx += Math.round(w * c.x / 100); sy += Math.round(h * c.y / 100)
  st.style.transform = `translate(${sx / dpr}px,${sy / dpr}px) scale(${sw / (STAGE_W * dpr)},${sh / (STAGE_H * dpr)})`
  _stageBox = { x: sx, y: sy, w: sw, h: sh, vw, vh, dpr }
  _placeMarkerLine()
}

// 위치 마커 선: 슬라이드 높이의 y% 자리, 보이는 슬라이드의 오른쪽 끝 (편집 미리보기와 같은 기준)
// 잘려서 안 보이는 곳에 있으면 #view 밖이라 보이지 않는다
let _marker = { visible: false, y: 50 }
function _placeMarkerLine(){
  const el = document.getElementById('markerLine')
  if (!el) return
  el.style.display = _marker.visible ? 'block' : 'none'
  const b = _stageBox
  if (!_marker.visible || !b) return
  const y = Math.max(0, Math.min(100, Number(_marker.y) || 0))
  el.style.top = ((b.y + b.h * y / 100) / b.dpr) + 'px'
  el.style.right = (Math.max(0, b.vw - (b.x + b.w)) / b.dpr) + 'px'
}
window.addEventListener('resize', fitStage)
// 배율이 다른 모니터로 옮겨지면 창의 CSS 크기가 같아도 화면 픽셀 경계가 달라진다
;(function watchDpr(){
  const mq = window.matchMedia(`(resolution: ${window.devicePixelRatio || 1}dppx)`)
  const onChange = () => { mq.removeEventListener('change', onChange); fitStage(); watchDpr() }
  mq.addEventListener('change', onChange)
})()
fitStage()

// 현재 표시 중인 레이어 ('A' 또는 'B')
let sL = 'A'

// 진행 중인 페이드 애니메이션 목록 (새 슬라이드 전환 시 이전 애니메이션 취소용)
let _fadeAnims = []
// 진행 중인 크로스페이드 상태. 그 사이 배경이 같은 슬라이드가 오면 배경 페이드는 끊지 않고 글자만 바꾼다 (_continueFade)
let _xf = null
// 진행 중인 전환(준비 대기 + 페이드)이 끝나는 예상 시각. 그 전에는 대기 영상 준비 같은 무거운 일을 미룬다
let _transitionUntil = 0

// 클릭 시 재생 모드일 때 등록된 핸들러 (슬라이드 전환 시 제거)
let _clickToPlayHandler = null

function _clearClickToPlay(){
  if(_clickToPlayHandler){
    document.removeEventListener('click', _clickToPlayHandler)
    _clickToPlayHandler = null
  }
}

// ── 미디어 캐시 ──
// index.html이 처음 한 번만 전체 data URL을 보내고 이후엔 mId만 전송하므로,
// 여기서 mId → data URL 매핑을 유지해 재사용한다.
const _mediaCache = {}

// ── 대기 영상: 곧 나올 영상 몇 개만 첫 화면까지 미리 준비해 둔다 ──
// 조작창이 슬라이드마다 '곧 나올 영상' 목록(up: 미리 본 배경 컨트롤 칸, 다음·이전 슬라이드의 영상)을 보낸다.
// 그중 앞의 STANDBY_MAX개만 숨김 <video>로 준비해 두고, 슬라이드가 그 영상을 쓰면 꺼내 써서 바로 시작한다.
//
// 프로젝트의 영상을 모두 준비해 두지 않는 이유:
//   크로미엄은 한 화면에 멈춰 있는 영상이 8개를 넘으면 그 영상들의 디코더를 곧바로 내린다(suspend).
//   그러면 반복용 쌍둥이와 대기 영상까지 내려가 시작할 때마다 디코더를 다시 만들어야 하고,
//   송출 시작 때 영상 수만큼 연달아 준비하는 동안과 꺼내 쓴 영상을 다시 채울 때마다 재생 중인 영상이 끊긴다.
//   (영상 36개 프로젝트: 모두 준비하면 재생 중 끊김 18회·반복 경계 멈칫 5회, 준비하지 않으면 1회·0회)
// 대기 영상은 재생 속도 0으로 '재생 중'인 채 둔다. 멈춘 영상은 15초쯤 지나면 디코더가 내려가지만, 재생 중인 영상은 그대로다.
// 준비·정리는 한가할 때 하나씩만 한다 (화면 전환 중이나 반복 경계 근처에서는 미룬다).
const STANDBY_MAX = 2
// 배경 컨트롤로 배경만 바꿀 때 새 배경 영상이 화면에 고르게 나오기를 기다리는 최대 시간(ms) (VideoLoop.whenRolling).
// 4K 송출에서는 새 영상이 화면에 처음 합성될 때 0.8초쯤 멈추는데, 그 구간을 페이드 전에 지나 보낸다.
// 보통 0.5~1초 안에 끝나고, 숫자키를 빨리 두 번 눌러 대기 영상 준비가 덜 됐을 때만 조금 더 걸린다
const BG_TAKE_WAIT = 3000
const _standby = new Map()     // 영상 키(mId) → 준비해 둔 <video>
let _standbyWant = []           // [{ key, url }] 준비해 둘 영상 (앞일수록 먼저 쓰일 영상)
let _standbyTimer = null
let _standbyBusyUntil = 0       // 막 만든 대기 영상이 첫 화면을 준비하는 동안은 다음 일을 미룬다

/** 숨김 대기 <video>를 만든다. 첫 화면이 준비되면 재생 속도 0으로 재생해 디코더가 내려가지 않게 둔다 */
function _makeStandbyVideo(url, onReady){
  const v = document.createElement('video')
  v.muted = true
  v.playsInline = true
  v.preload = 'auto'
  v.style.cssText = 'position:fixed;width:0;height:0;opacity:0;pointer-events:none;left:-9999px;top:-9999px;'
  let done = false
  const ready = () => {
    if (done) return
    done = true
    clearTimeout(timer)
    if ([..._standby.values()].includes(v) && !v.error) {
      v.playbackRate = 0
      v.play().catch(() => {})
    }
    onReady()
  }
  const timer = setTimeout(ready, 3000)
  v.addEventListener('loadeddata', ready, { once: true })
  v.addEventListener('error', ready, { once: true })
  v.src = url
  document.body.appendChild(v)
  return v
}

/** 대기 영상 하나를 완전히 내려 디코더를 돌려준다 */
function _dropStandby(key){
  const v = _standby.get(key)
  _standby.delete(key)
  if (v) { try { v.pause(); v.removeAttribute('src'); v.load() } catch (e) {} ; v.remove() }
}

/**
 * 준비해 둔 영상을 꺼낸다 (없으면 null). 멈춘 상태·원래 속도로 돌려주므로 쓰는 쪽이 재생 여부를 정한다.
 * 빈자리는 한가할 때 다시 채운다.
 */
function _takeStandby(key){
  const v = key ? _standby.get(key) : null
  if (!v) return null
  // 불러오지 못한 영상이면 버리고 새로 만들게 한다
  if (v.error) { _dropStandby(key); return null }
  _standby.delete(key)
  v.pause()
  v.playbackRate = 1
  _scheduleStandby()
  return v
}

/** 조작창이 보낸 '곧 나올 영상' 목록을 받는다. [{ key, url(처음 한 번만 올 수 있음) }] */
function _setUpcoming(list){
  if (!Array.isArray(list)) return
  const want = []
  list.forEach(it => {
    if (!it || !it.key) return
    if (it.url) _mediaCache[it.key] = it.url
    const url = _mediaCache[it.key]
    if (url && want.length < STANDBY_MAX && !want.some(w => w.key === it.key)) want.push({ key: it.key, url })
  })
  _standbyWant = want
  _scheduleStandby()
}

/** 지금 보이지 않는 슬라이드 레이어의 배경 컨테이너 (#MA/#MB) */
function _hiddenMl(){ return document.getElementById('M' + (sL === 'A' ? 'B' : 'A')) }

/**
 * 그 영상이 이미 화면에 있거나(보이는 레이어·그룹 배경) 보이지 않는 레이어에 남아 있는지 (지나간 영상을 곧 다시 쓰려고 남겨 둔 것).
 * 그렇다면 대기 영상을 따로 만들지 않는다 (같은 영상의 디코더를 하나 더 열지 않게)
 */
function _isParked(key){
  if (!key) return false
  if (_gbgLayer && _gbgLayer.key() === key) return true
  return ['A', 'B'].some(l => {
    const ml = document.getElementById('M' + l)
    return !!(ml && ml.dataset.mId === key && ml.querySelector('video[src]'))
  })
}

/**
 * 화면에서 사라진 레이어의 영상: 곧 다시 쓸 영상(대기 목록에 있음)이면 재생 속도 0으로 세워 두고,
 * 아니면 멈춘다 (멈춘 영상은 한가할 때 _tickStandby가 내린다).
 * 멈춘 영상은 15초쯤 지나면 디코더가 내려가, 다시 나타날 때 멈춘 자리까지 키프레임부터 다시 풀어야 해서 한참 멈칫한다.
 * 클릭 시 재생 영상은 원래대로 멈춰 두어 돌아왔을 때 다시 클릭을 기다린다.
 */
function _parkOrPause(ml, vids){
  const main = ml.querySelector('video:not([data-loop-twin])')
  const key = ml.dataset.mId
  const act = main ? _activeVidIn(ml) : null
  const park = !!(act && !act.paused && key && ml.dataset.auto === '1'
    && _standbyWant.some(w => w.key === key) && !(window.VideoLoop && VideoLoop.busy(main)))
  vids.forEach(v => {
    if (!ml.contains(v)) return
    if (park && v === act) { v.muted = true; v.playbackRate = 0 }
    else v.pause()
  })
}

/**
 * 지금 화면 전환·반복 경계로 바쁜지. 바쁠 때 디코더를 만들거나 내리면 보이는 영상과 페이드가 끊긴다.
 * 반복 경계 근처: 쌍둥이를 준비하고 넘겨주는 동안 (끝나기 3.2초 전 ~ 넘겨준 직후)
 */
function _standbyBusy(){
  const now = performance.now()
  if (now < _transitionUntil + 600 || now < _standbyBusyUntil) return true
  const v = _getOutVid()
  if (v && !v.paused && window.VideoLoop && VideoLoop.looping(v)) {
    if (VideoLoop.busy(v)) return true
    const dur = v.duration
    if (dur && isFinite(dur)) {
      const left = dur - v.currentTime
      if (left < Math.min(3.2, dur * 0.4) || v.currentTime < 0.8) return true
    }
  }
  return false
}

/** 한가할 때 대기 영상을 하나씩 정리·준비한다 */
function _scheduleStandby(delay){
  if (_standbyTimer) return
  _standbyTimer = setTimeout(() => { _standbyTimer = null; _tickStandby() }, delay || 300)
}

function _tickStandby(){
  if (_standbyBusy()) { _scheduleStandby(250); return }
  const want = new Set(_standbyWant.map(w => w.key))
  // 1) 더는 쓸 일이 없는 대기 영상을 내린다
  for (const key of _standby.keys()) {
    if (!want.has(key)) { _dropStandby(key); _scheduleStandby(150); return }
  }
  // 2) 지나간 영상이 보이지 않는 레이어·그룹 배경에 남아 있으면, 곧 다시 쓰지 않는 한 내린다
  const ml = _hiddenMl()
  if (ml && ml.querySelector('video[src]') && !want.has(ml.dataset.mId)) {
    _unloadVideosIn(ml)
    while (ml.firstChild) ml.removeChild(ml.firstChild)
    ml.dataset.cacheKey = ''
    ml.dataset.mId = ''
    _scheduleStandby(150)
    return
  }
  if (_gbgLayer && !_gbgLayer.active() && _gbgLayer.key() && !want.has(_gbgLayer.key())) {
    _gbgLayer.release()
    _scheduleStandby(150)
    return
  }
  // 3) 필요한 영상을 하나 준비한다. 첫 화면이 준비될 때까지 다음 일은 미룬다
  for (const w of _standbyWant) {
    if (_standby.has(w.key) || _isParked(w.key)) continue
    _standbyBusyUntil = performance.now() + 3000
    _standby.set(w.key, _makeStandbyVideo(w.url, () => { _standbyBusyUntil = 0; _scheduleStandby(200) }))
    return
  }
}

// ── 영상 싱크 (송출 → 편집 창) ──
// 송출 영상을 기준 시계로 삼는다. 송출 쪽은 절대 강제로 seek하지 않으므로 끊김이 없고,
// 편집 미리보기가 이 보고값을 받아 재생 속도를 미세 조정해 따라온다.
let _vidLayer = 'A'

// ── 배경 밝기 ──
// 편집 창의 배경 컨트롤에서 정한 밝기(1 = 원래 밝기)를 배경 사진·영상 컨테이너(#MA/#MB/#GBG)에만 건다.
// 가사·텍스트에는 걸지 않는다. 1이면 filter를 비워 불필요한 합성 레이어를 만들지 않는다.
// PPT 내보내기(__captureSlide)는 bgb를 보내지 않으므로 항상 원래 밝기다.
function _bgFilter(v){
  const n = Number(v)
  if (v == null || !Number.isFinite(n) || Math.abs(n - 1) < 0.001) return ''
  return `brightness(${Math.max(0, Math.min(2, n))})`
}

/**
 * 배경 컨테이너의 밝기 filter를 바꾼다. dur(초)이 있으면 그 시간 동안 부드럽게 바뀐다.
 * Web Animations는 합성 스레드에서 돌아 영상이 재생 중이어도 끊기지 않는다.
 */
function _setBgFilter(el, f, dur){
  if (!el) return
  // 바뀌는 중이었다면 지금 보이는 값에서 이어서 바꾼다
  const from = el._bgFilterAnim ? getComputedStyle(el).filter : (el.style.filter || 'none')
  if (el._bgFilterAnim) { el._bgFilterAnim.cancel(); el._bgFilterAnim = null }
  el.style.filter = f
  const to = f || 'none'
  if (dur > 0 && from !== to && el.animate) {
    const a = el.animate([{ filter: from }, { filter: to }], { duration: dur * 1000, easing: 'ease-in-out' })
    el._bgFilterAnim = a
    a.onfinish = () => { if (el._bgFilterAnim === a) el._bgFilterAnim = null }
  }
}

// 그룹 배경 영상 레이어 (같은 그룹 영상을 쓰는 슬라이드끼리는 영상을 이어서 재생)
let _gbgLayer = null
function _getGbgLayer(){
  if (!_gbgLayer && window.GroupBgLayer) {
    _gbgLayer = GroupBgLayer.create(document.getElementById('GBG'), {
      takeVideo: spec => _takeStandby(spec.key),
      // 사라진 그룹 배경 영상: 곧 다시 쓸 영상이면 재생 속도 0으로 세워 둔다 (멈추면 15초쯤 뒤 디코더가 내려가
      // 다시 나타날 때 멈춘 자리까지 키프레임부터 다시 풀어야 해서 한참 멈칫한다)
      park: (v, key) => _standbyWant.some(w => w.key === key),
      onAwaitPlay: (v, spec) => {
        // 클릭 시 재생: 화면을 한 번 클릭하면 시작 (다른 송출 화면도 함께)
        _clearClickToPlay()
        _clickToPlayHandler = () => {
          v.muted = !spec.audio
          v.play().catch(() => {})
          _clickToPlayHandler = null
          window.electronAPI?.sendVideoPlay?.()
        }
        document.addEventListener('click', _clickToPlayHandler, { once: true })
      }
    })
  }
  return _gbgLayer
}
/**
 * 슬라이드 데이터의 gbg에 맞춰 그룹 영상 레이어를 보이거나 숨긴다. 보이는 영상 요소를 돌려준다 (없으면 null)
 * rollMs: 다른 영상으로 바뀔 때 새 영상이 제대로 돌기 시작할 때까지 기다릴 최대 시간 (배경 컨트롤 전환)
 */
function _updateGroupBg(d, fd, rollMs){
  const layer = _getGbgLayer()
  if (!layer) return null
  const g = d && d.gbg
  // 사라지는 영상은 원래 밝기를 유지한 채 페이드아웃되도록, 보일 때만 밝기를 바꾼다
  if (!g) { layer.hide(fd); return null }
  _setBgFilter(document.getElementById('GBG'), _bgFilter(d.bgb), fd)
  if (g.key && g.url) _mediaCache[g.key] = g.url
  const url = (g.key && _mediaCache[g.key]) || g.url
  return layer.show({ ...g, url }, fd, rollMs)
}

/** 레이어(.ml) 안에서 지금 보이며 재생 중인 영상 요소. 반복 이어달리기 중이면 쌍둥이 쪽일 수 있다 */
function _activeVidIn(ml){
  const v = ml ? ml.querySelector('video:not([data-loop-twin])') : null
  return (v && window.VideoLoop) ? VideoLoop.active(v) : v
}

/** 영상을 완전히 내려 디코더를 바로 돌려준다 (반복 이어달리기 쌍둥이까지) */
function _unloadVideosIn(el){
  if (!el) return
  el.querySelectorAll('video:not([data-loop-twin])').forEach(v => {
    const keep = window.VideoLoop ? VideoLoop.detach(v) : v
    ;[v, keep].forEach(x => { try { x.pause(); x.removeAttribute('src'); x.load() } catch (e) {} })
  })
}

/** 현재 송출 중인 영상 요소 (없으면 null) */
function _getOutVid(){
  if (_gbgLayer && _gbgLayer.active()) return _gbgLayer.video()
  return _activeVidIn(document.getElementById('M' + _vidLayer))
}

function _reportVideoState(){
  if (!window.electronAPI || !window.electronAPI.sendVideoState) return
  const v = _getOutVid()
  const ml = (_gbgLayer && _gbgLayer.active()) ? document.getElementById('GBG') : document.getElementById('M' + _vidLayer)
  const mId = ml ? ml.dataset.mId : ''
  if (!v || !mId || v.readyState < 1) return
  // dir: 역재생 왕복의 거꾸로 재생 구간이면 -1 (그동안 영상은 멈춘 채 뒤로 탐색하므로 paused만으로는 알 수 없다)
  const dir = (window.VideoLoop && VideoLoop.reversing(v)) ? -1 : 1
  // xf: 페이드 반복으로 끝과 처음을 겹치는 중이면 { t: 겹쳐 나오는 영상 위치, p: 진행도 }
  const xf = window.VideoLoop ? VideoLoop.fadeInfo(v) : null
  window.electronAPI.sendVideoState({ mId, t: v.currentTime, paused: v.paused, dir, xf, at: Date.now() })
}
setInterval(_reportVideoState, 100)
// 재생 시작·정지·구간 이동 시에는 즉시 보고 (간격을 기다리지 않음)
;['playing', 'pause', 'seeked'].forEach(ev => document.addEventListener(ev, e => {
  if (e.target === _getOutVid()) _reportVideoState()
}, true))

/**
 * 추가 텍스트 박스들을 지정된 레이어에 렌더링한다.
 * 번역문, 곡 정보 등 슬라이드마다 다른 위치에 놓이는 자유 배치 텍스트박스.
 *
 * @param {string} layerId - 렌더링할 레이어 ID (예: 'XA', 'XB')
 * @param {Array}  boxes   - 텍스트박스 설정 배열
 *   각 항목 구조: { text, x, y, width, fontSize, fontColor, fontFamily, align,
 *                   textAnchor, textShadowEnabled, textShadowIntensity,
 *                   textOutlineEnabled, textOutlineWidth }
 */
function renderExtraBoxes(layerId, boxes) {
  const layer = document.getElementById(layerId)
  if(!layer) return
  layer.innerHTML = ''
  if(!Array.isArray(boxes) || !boxes.length) return

  boxes.forEach(box => {
    if(!box || !box.text) return

    const el = document.createElement('div')
    el.className = 'etb'

    // 텍스트를 내부 span에 배치 — 편집화면과 동일한 구조
    // (.etb CSS의 text-shadow가 크로마키 !important로 제거돼도 span 인라인값은 유지됨)
    const textSpan = document.createElement('span')
    textSpan.style.whiteSpace = 'pre-wrap'
    textSpan.textContent = String(box.text || '')
    el.appendChild(textSpan)

    // 위치와 크기 설정 (단위: %)
    const x = Number.isFinite(parseFloat(box.x)) ? parseFloat(box.x) : 50
    const y = Number.isFinite(parseFloat(box.y)) ? parseFloat(box.y) : 72
    const w = Number(box.width) || 42
    const h = Number(box.height) || 8
    const align = box.align || 'center'

    // textAnchor: 'ctr'=중앙기준, 't'=상단기준, 'b'=하단기준
    const bAnc = box.textAnchor || 'ctr'
    el.style.left = x + '%'
    el.style.top = y + '%'
    el.style.width = w + '%'
    el.style.height = h + '%'  // 편집창과 동일하게 높이도 지정 (상단/하단 기준일 때 세로 위치가 같아짐)
    el.style.transform = `translate(-50%,${bAnc==='t'?'0':bAnc==='b'?'-100':'-50'}%)`

    // 폰트 스타일 (편집창: fontSize×editorScale, 송출 무대: fontSize×1.4)
    el.style.fontSize = Math.max(6, Number(box.fontSize) || 24) * STAGE_K + 'px'
    el.style.color = box.fontColor || '#ffffff'
    el.style.fontFamily = "'" + (box.fontFamily || 'Noto Sans KR') + "', 'Noto Sans KR', sans-serif"

    // 그림자 효과 — 편집화면과 동일한 공식, 내부 span에 적용
    textSpan.style.textShadow = computeTextShadowCSS(box.textShadowEnabled, box.textShadowIntensity, STAGE_K)

    // 외곽선(아웃라인) 효과 — 두께도 무대 배율만큼
    const bOutlineOn = (box.textOutlineEnabled === true)
    const bOw = (box.textOutlineWidth || 2) * STAGE_K

    el.style.textAlign = align
    el.style.justifyContent = align === 'left' ? 'flex-start' : align === 'right' ? 'flex-end' : 'center'
    el.style.textShadow = 'none'  // .etb CSS 기본 그림자 초기화 (span에서 직접 제어)
    textSpan.style.webkitTextStroke = bOutlineOn ? `${bOw}px rgba(0,0,0,0.85)` : ''
    textSpan.style.paintOrder = bOutlineOn ? 'stroke fill' : ''

    layer.appendChild(el)
  })
}

function renderShapeBoxes(layerId, boxes){
  const layer=document.getElementById(layerId);
  if(!layer) return;
  layer.innerHTML='';
  if(!Array.isArray(boxes)||!boxes.length) return;
  boxes.forEach(box=>{
    const x=Number(box.x)||50;
    const y=Number(box.y)||50;
    const w=Math.max(0.2, Number(box.w)||10);
    const h=Math.max(0.2, Number(box.h)||10);
    const fillColor=box.fillColor||'transparent';
    const lineColor=box.lineColor||'transparent';
    const lineWidth=Math.max(0, Number(box.lineWidth)||0);
    const el=document.createElement('div');
    el.style.position='absolute';
    el.style.left=x+'%';
    el.style.top=y+'%';
    el.style.width=w+'%';
    el.style.height=h+'%';
    el.style.transform='translate(-50%,-50%)';
    el.style.background=fillColor;
    const hasLine=(lineColor!=='transparent' && lineWidth>0);
    el.style.border=hasLine ? `${lineWidth*STAGE_K}px solid ${lineColor}` : 'none';
    if(String(box.shapeType||'').includes('ellipse')) el.style.borderRadius='50%';
    layer.appendChild(el);
  });
}

/** 슬라이드 데이터의 배경 미디어 주소 (mId 캐시에서 복원). 처음 받은 data URL은 캐시에 등록한다 */
function _mediaURLOf(d){
  if (d.mId && d.mURL) _mediaCache[d.mId] = d.mURL
  return (d.mId && _mediaCache[d.mId]) ? _mediaCache[d.mId] : (d.mURL || '')
}

/**
 * 배경 미디어 캐시 키: 미디어와 위치·배율·맞춤, 영상 설정(소리·반복·자동재생)까지 같으면 같은 키.
 * 레이어의 dataset.cacheKey와 비교해 다시 그릴지, 영상을 이어서 재생할지 정한다.
 */
function _mediaKeyOf(d){
  const mFit = ['cover','contain','fill'].includes(d.mFit) ? d.mFit : 'cover'
  return `${d.mId || _mediaURLOf(d)}|${d.mOffX ?? 50}|${d.mOffY ?? 50}|${d.mScale ?? 100}|${mFit}|${!!d.mAudioEnabled}|${d.mLoop!==false}|${d.mAutoPlay!==false}|${d.mLoopMode || 'normal'}|${d.mLoopFade ?? 1}`
}

/**
 * 키 입력을 통일된 형태로 정규화한다.
 * 스페이스바는 'Space' 문자열로 변환.
 *
 * @param {string} key - KeyboardEvent.key 값
 * @returns {string} 정규화된 키 이름
 */
function normalizeOutputKey(key){
  if(key===' ') return 'Space';
  return String(key||'').trim();
}

/*
  키보드 단축키 처리
  - 방향키(→↓) / PageDown : 다음 슬라이드
  - 방향키(←↑) / PageUp   : 이전 슬라이드
  - 스페이스바              : 자동재생 토글
  - Escape                  : 송출 정지
  - 그 외 키               : 메인 조작창(index.html)으로 전달

  주의: 이 화면은 외부 모니터에 전체화면으로 표시되므로,
        키 이벤트를 잡아서 조작창에 전달하는 방식으로 원격 제어가 가능하다.
*/
document.addEventListener('keydown',e=>{
  const key=normalizeOutputKey(e.key);

  // 다음 슬라이드
  if(e.key==='ArrowRight' || e.key==='ArrowDown' || key==='PageDown'){
    e.preventDefault();
    window.electronAPI?.sendOutputControl?.('next');
    return;
  }

  // 이전 슬라이드
  if(e.key==='ArrowLeft' || e.key==='ArrowUp' || key==='PageUp'){
    e.preventDefault();
    window.electronAPI?.sendOutputControl?.('prev');
    return;
  }

  // 자동재생 토글
  if(key==='Space'){
    e.preventDefault();
    window.electronAPI?.sendOutputControl?.('toggleAuto');
    return;
  }

  // 송출 정지
  if(e.key==='Escape'){
    e.preventDefault();
    window.electronAPI?.sendOutputControl?.('stopBroadcast');
    return;
  }

  // 그 외 키는 메인 조작창으로 전달 (단축키 커스터마이징 지원)
  // repeat: 키를 꾹 눌러 생긴 반복 입력인지 (배경 컨트롤 숫자키는 반복 입력을 무시한다)
  window.electronAPI?.sendOutputControl?.({
    type:'key',
    key:e.key,
    code:e.code || '',
    altKey:!!e.altKey,
    ctrlKey:!!e.ctrlKey,
    metaKey:!!e.metaKey,
    shiftKey:!!e.shiftKey,
    repeat:!!e.repeat
  });
});

/** 클릭 시 재생: 화면을 한 번 클릭하면 이 영상을 재생한다 (다른 송출 화면도 조작창을 거쳐 함께 재생) */
function _armClickToPlay(vid, wantAudio){
  _clearClickToPlay()
  _clickToPlayHandler = () => {
    vid.muted = !wantAudio
    vid.volume = 1
    vid.play().catch(() => {})
    _clickToPlayHandler = null
    window.electronAPI?.sendVideoPlay?.()
  }
  document.addEventListener('click', _clickToPlayHandler, { once: true })
}

/**
 * 이어 재생: 지금 보이는 레이어(fromMl)의 영상이 다음 슬라이드에도 같은 위치·같은 설정으로 쓰이면
 * 재생 중인 <video>를 새 레이어(toMl)로 옮긴다. 같은 문서 안에서 바로 옮기면 재생이 끊기지 않으므로
 * 슬라이드를 넘겨도 영상이 처음부터 다시 시작하거나 멈추지 않는다. 옮겼으면 true.
 */
function _carryVideo(fromMl, toMl, d){
  if (!fromMl || !toMl || d.mType !== 'video') return false
  const key = _mediaKeyOf(d)
  if (fromMl.dataset.cacheKey !== key) return false
  // 반복 이어달리기 쌍둥이도 함께, 겹친 순서 그대로 옮긴다
  const vids = [...fromMl.querySelectorAll('video')]
  if (!vids.some(v => !v.hasAttribute('data-loop-twin'))) return false
  _unloadVideosIn(toMl)
  while (toMl.firstChild) toMl.removeChild(toMl.firstChild)
  vids.forEach(v => toMl.appendChild(v))
  toMl.dataset.cacheKey = key
  fromMl.dataset.cacheKey = ''
  return true
}

/**
 * 지정된 레이어(A 또는 B)에 슬라이드 내용을 채운다.
 * 가사, 배경 이미지/영상, 추가 텍스트박스 등 모든 시각 요소를 적용한다.
 *
 * @param {string} L  - 레이어 식별자 ('A' 또는 'B')
 * @param {Object} d  - 슬라이드 데이터 객체
 *   주요 속성:
 *     d.lyrics          - 가사 텍스트
 *     d.sub             - 소제목(번역문 등)
 *     d.fs              - 폰트 크기(px)
 *     d.fc              - 폰트 색상(hex)
 *     d.ff              - 폰트 이름
 *     d.textX/Y         - 텍스트 위치(%)
 *     d.textWidth       - 텍스트 너비(%)
 *     d.textAnchor      - 수직 기준점 ('t'/'ctr'/'b')
 *     d.layoutType      - 레이아웃 타입
 *     d.textShadowEnabled/Intensity - 그림자 설정
 *     d.textOutlineEnabled/Width    - 아웃라인 설정
 *     d.bgColor         - 배경 색상
 *     d.mURL            - 배경 미디어 URL
 *     d.mType           - 미디어 타입 ('image'/'video')
 *     d.mOffX/Y         - 미디어 위치 오프셋(%)
 *     d.mScale          - 미디어 확대 비율(%)
 *     d.textBoxes       - 추가 텍스트박스 배열
 * @param {Object} [opts]
 *     opts.carried      - 바로 앞 슬라이드의 같은 영상을 이 레이어로 옮겨 왔음 (되감지 않고 이어서 재생)
 */
function fillL (L, d, opts) {
  // 가장 최근에 그린 레이어 = 현재 영상이 재생되는 레이어 (크로스페이드 중에도 새 쪽을 가리킴)
  _vidLayer = L
  const _mlEl = document.getElementById('M' + L)
  if (_mlEl) {
    _mlEl.dataset.mId = (d.mType === 'video' && d.mId) ? d.mId : ''
    _mlEl.dataset.auto = d.mAutoPlay !== false ? '1' : ''   // 화면에서 사라질 때 세워 둘지 정할 때 쓴다 (_parkOrPause)
  }
  // 레이어 배경색 적용 — 레이어 맨 아래 .bgc에 설정 (페이드 때 다른 요소와 함께 하나씩 투명해진다)
  // 크로마키 슬라이드는 bgColor가 없을 때 chromaKeyColor를 사용
  // ck-on 클래스는 레이어에 토글해 미디어/그림자를 제거 (크로스페이드 호환)
  const layerEl = document.getElementById('L' + L)
  const bgcEl = document.getElementById('BG' + L)
  if (bgcEl) {
    bgcEl.style.backgroundColor = d.chromaKey
      ? (d.bgColor || d.chromaKeyColor || '#00b140')
      : (d.bgColor || '')
  }
  if (layerEl) layerEl.classList.toggle('ck-on', !!d.chromaKey)

  // 레이아웃 타입과 텍스트 위치 설정
  const layout = d.layoutType || 'centerLyrics'
  const tx = Number.isFinite(parseFloat(d.textX)) ? parseFloat(d.textX) : 50
  const ty = Number.isFinite(parseFloat(d.textY)) ? parseFloat(d.textY) : 50

  const textWrap = document.getElementById('TW' + L)
  if (textWrap) {
    textWrap.className = 'tl layout-' + layout + ' manual-pos'
    textWrap.style.setProperty('--tx', tx + '%')
    textWrap.style.setProperty('--ty', ty + '%')

    // textAnchor: 텍스트 박스의 수직 기준점
    const tAnc = d.textAnchor || 'ctr'
    textWrap.style.setProperty('--ty-anc', tAnc === 't' ? '0%' : tAnc === 'b' ? '-100%' : '-50%')

    // 텍스트 너비 설정 (없으면 CSS 기본값 사용)
    if (Number.isFinite(parseFloat(d.textWidth))) {
      textWrap.style.width = parseFloat(d.textWidth) + '%'
      textWrap.style.maxWidth = 'none'
    } else {
      textWrap.style.width = ''
      textWrap.style.maxWidth = ''
    }

    // 텍스트 높이 설정 (없으면 CSS 기본값 사용)
    if (Number.isFinite(parseFloat(d.textHeight))) {
      textWrap.style.height = parseFloat(d.textHeight) + '%'
      textWrap.style.justifyContent = 'center'
    } else {
      textWrap.style.height = ''
      textWrap.style.justifyContent = ''
    }
  }

  // 가사 텍스트와 스타일 적용
  const tEl = document.getElementById('T'+L)

  // 그림자/아웃라인을 내부 span에 적용 — .ly 요소의 크로마키 !important CSS를 우회
  let tSpan = tEl.querySelector('span')
  if (!tSpan) { tSpan = document.createElement('span'); tEl.appendChild(tSpan) }
  tSpan.style.whiteSpace = 'pre-wrap'
  tSpan.textContent = d.lyrics || ''

  // 그림자 — 편집화면과 동일한 공식
  const outlineOn = (d.textOutlineEnabled === true)
  const outlineW = (d.textOutlineWidth || 2) * STAGE_K

  tSpan.style.textShadow = computeTextShadowCSS(d.textShadowEnabled, d.textShadowIntensity, STAGE_K)
  tSpan.style.webkitTextStroke = outlineOn ? `${outlineW}px rgba(0,0,0,0.85)` : ''
  tSpan.style.paintOrder = outlineOn ? 'stroke fill' : ''

  // .ly 컨테이너에는 폰트/색상만 설정, 그림자는 제거(span이 담당)
  // d.fs는 이미 fontSize×1.4(무대 배율) 값
  const fsPx = Math.max(6 * STAGE_K, d.fs || 52)
  tEl.setAttribute('style',
    `font-size:${fsPx}px;`+
    `color:${d.fc || '#fff'};`+
    `font-family:'${d.ff || 'Noto Serif KR'}', 'Noto Serif KR', serif;`+
    `text-shadow:none;`
  )

  // 소제목 텍스트와 크기 적용 (편집창과 같은 공식: 본문×0.38, 최소 10×배율)
  const subEl = document.getElementById('S'+L)
  const subText = d.sub || ''
  subEl.textContent = subText
  subEl.style.fontSize = Math.max(fsPx * 0.38, 10 * STAGE_K) + 'px'
  subEl.style.display = subText ? '' : 'none'

  // 구버전 호환 요소 초기화 (그룹 칩 요소는 송출화면에 없으므로 null 체크)
  const chipEl = document.getElementById('C'+L)
  if(chipEl){
    chipEl.textContent = ''
    chipEl.style.background = 'transparent'
    chipEl.style.color = 'transparent'
  }
  renderShapeBoxes('O'+L, d.shapeBoxes || [])

  // 추가 텍스트박스(번역문 등) 렌더링
  renderExtraBoxes('X'+L, d.textBoxes || [])

  // 배경 미디어(이미지/영상) 처리
  // mId 기반 캐시: index.html이 처음 한 번만 전체 data URL을 보내고
  // 이후엔 mId만 전송하므로, 여기서 캐시에서 URL을 복원한다.
  const resolvedURL = _mediaURLOf(d)

  const ml = document.getElementById('M'+L)
  // 배경 밝기는 새로 그리는 레이어에만 건다 → 크로스페이드 중에도 사라지는 배경은 이전 밝기 유지
  _setBgFilter(ml, _bgFilter(d.bgb), 0)
  const mOffX = d.mOffX ?? 50
  const mOffY = d.mOffY ?? 50
  const mScale = d.mScale ?? 100
  const mFit = ['cover','contain','fill'].includes(d.mFit) ? d.mFit : 'cover'
  // cacheKey: 영상 설정(소리·반복·자동재생)도 포함해 설정 변경 시 비디오 재생성
  const mCacheKey = _mediaKeyOf(d)
  if (ml.dataset.cacheKey !== mCacheKey) {
    ml.dataset.cacheKey = mCacheKey
    // 이전 영상은 디코더를 바로 돌려주도록 완전히 내린다 (그냥 떼어 내면 한동안 메모리에 남는다)
    _unloadVideosIn(ml)
    while (ml.firstChild) ml.removeChild(ml.firstChild)
    if (resolvedURL) {
      // 미디어를 지정한 오프셋/배율/맞춤 모드로 배치하는 공통 CSS
      const bgCss = `position:absolute;width:${mScale}%;height:${mScale}%;left:${mOffX}%;top:${mOffY}%;transform:translate(-50%,-50%);object-fit:${mFit};max-width:none;max-height:none;display:block;`
      if (d.mType === 'image') {
        const img = new Image()
        img.src = resolvedURL
        img.style.cssText = bgCss
        ml.appendChild(img)
      } else {
        // 영상: 소리·반복·재생방식을 슬라이드 설정에 따라 결정
        _clearClickToPlay()
        const wantAudio = !!d.mAudioEnabled
        const autoPlay = d.mAutoPlay !== false
        // 미리 첫 화면까지 준비해 둔 대기 영상이 있으면 꺼내 쓴다 (바로 시작한다)
        const poolVid = _takeStandby(d.mId)
        const vid = poolVid || document.createElement('video')
        if (poolVid) {
          vid.loop = d.mLoop !== false
          vid.volume = 1
        } else {
          vid.src = resolvedURL
          vid.loop = d.mLoop !== false
          vid.volume = 1
        }
        vid.style.cssText = bgCss
        ml.appendChild(vid)
        // 반복 방식(처음부터 / 역재생 왕복 / 페이드 반복) 적용
        if (window.VideoLoop) VideoLoop.attach(vid, { loop: d.mLoop !== false, mode: d.mLoopMode, fade: d.mLoopFade })
        if(autoPlay){
          // 자동 재생: 먼저 음소거로 play() 성공 확보 → 재생 후 소리 설정 적용
          // (Chromium 자동재생 정책은 음소거 재생을 항상 허용)
          vid.autoplay = true
          vid.muted = true
          vid.play().then(() => {
            // 재생 시작 후 소리 설정 반영 (여기서는 정책 제한 없음)
            vid.muted = !wantAudio
            vid.volume = 1
          }).catch(() => {})
        } else {
          // 클릭 시 재생: 자동재생 완전 차단, 화면 클릭 시에만 재생
          vid.autoplay = false
          vid.preload = 'auto'
          vid.muted = !wantAudio
          vid.volume = 1
          _armClickToPlay(vid, wantAudio)
        }
      }
    }
  } else if (d.mType === 'video' && opts && opts.carried) {
    // 바로 앞 슬라이드와 같은 영상을 넘겨받음: 멈추거나 되감지 않고 그대로 이어서 재생
    // (클릭 시 재생 영상이 아직 시작 전이면 클릭 대기만 다시 걸어 둔다)
    const v = _activeVidIn(ml)
    if (v && v.paused && !v.ended && d.mAutoPlay === false) _armClickToPlay(v, !!d.mAudioEnabled)
  } else if (d.mType === 'video') {
    // 같은 영상이 이 레이어에 멈춘 채 남아 있음 (예: 영상 → 사진 → 같은 영상):
    // 처음으로 되감지 않고 멈춘 자리에서 이어서 재생한다 (되감으면 처음부터 다시 나오고, 무거운 영상은 잠깐 멈춘다)
    // 재생 속도 0으로 세워 둔 영상(_parkOrPause)은 디코더가 살아 있어 바로 이어진다
    const v = _activeVidIn(ml)
    if (v && v.playbackRate === 0) v.playbackRate = 1
    if (v && d.mAutoPlay !== false) {
      if (v.paused) {
        v.muted = true
        v.play().then(() => { v.muted = !d.mAudioEnabled; v.volume = 1 }).catch(() => {})
      } else {
        v.muted = !d.mAudioEnabled
      }
    } else if (v && v.paused && !v.ended) {
      _armClickToPlay(v, !!d.mAudioEnabled)
    }
  }
}

/** 슬라이드 배경(사진·영상·배경색·그룹 영상·밝기)의 서명. 같으면 배경이 같다 */
function _bgSigOf(d){
  const bg = d.chromaKey ? (d.bgColor || d.chromaKeyColor || '#00b140') : (d.bgColor || '')
  return [_mediaKeyOf(d), d.mType || '', bg, !!d.chromaKey, (d.gbg && d.gbg.key) || '', d.bgb ?? ''].join('#')
}

/** 레이어 안의 배경 부분(배경색·사진/영상)인지. 나머지(도형·글자)는 슬라이드마다 바뀌는 부분 */
function _isBgPart(el){
  return el.classList.contains('bgc') || el.classList.contains('ml')
}

/**
 * 크로스페이드 중에 배경이 같은 다음 슬라이드가 왔을 때: 배경 페이드는 그대로 이어 가고 글자·도형만 바꾼다.
 * (배경 컨트롤로 배경을 바꾸는 중에 슬라이드를 넘겨도 배경이 툭 바뀌지 않는다)
 *   - 나타나는 레이어의 지금 글자·도형을 복사해 같은 자리에 겹쳐 두고 fd초 동안 투명하게 한 뒤, 레이어에는 새 슬라이드를 그린다
 *   - 사라지는 레이어의 글자·도형은 지금 보이는 투명도에서 fd초 동안 마저 사라진다 (배경 페이드가 길어도 남아 있지 않게)
 */
function _continueFade(x, d, fd){
  const ms = fd * 1000
  if (ms <= 0) x.nEl.querySelectorAll('.xf-ghost').forEach(g => g.remove())
  ;[...x.nEl.children].forEach(el => {
    // 즉시 전환이면 복사본 없이 글자만 바로 바뀐다
    if (ms <= 0 || _isBgPart(el) || el.classList.contains('xf-ghost')) return
    const g = el.cloneNode(true)
    g.classList.add('xf-ghost')
    g.removeAttribute('id')
    g.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'))
    el.after(g)
    const a = g.animate([{ opacity: 1 }, { opacity: 0 }], { duration: ms, easing: 'ease-in-out', fill: 'forwards' })
    a.onfinish = () => g.remove()
  })

  if (x.anims) {
    x.anims.forEach((old, el) => {
      if (_isBgPart(el)) return
      const op = parseFloat(getComputedStyle(el).opacity) || 0
      old.onfinish = null
      try { old.cancel() } catch (e) {}
      const a = el.animate([{ opacity: op }, { opacity: 0 }], { duration: ms, easing: 'ease-in-out', fill: 'forwards' })
      a.onfinish = x.check
      x.anims.set(el, a)
    })
  } else {
    // 아직 새 화면 준비를 기다리는 중: 페이드가 시작될 때 글자는 이 시간으로 사라진다
    x.textMs = ms
  }
  x.extend(ms)

  // 배경은 이미 그려져 있으므로(같은 서명) 영상은 되감지 않고 이어서, 글자만 새로 그린다
  fillL(x.nL, d, { carried: true })
  _updateGroupBg(d, fd)
  _setUpcoming(d.up)
  _transitionUntil = Math.max(_transitionUntil, performance.now() + ms)
}

/**
 * 슬라이드를 화면에 표시한다.
 * 페이드 시간(fd)이 있으면 A↔B 레이어를 교차해 크로스페이드,
 * 없으면 현재 레이어를 바로 업데이트한다.
 *
 * 크로스페이드 동작 (끊기지 않고 부드럽게):
 *   1. 사용하지 않는 레이어(nL)에 새 슬라이드를 그려 현재 레이어(sL) 뒤에 둔다.
 *      바로 앞 슬라이드와 같은 영상이면 재생 중인 영상을 nL로 옮겨 이어서 재생한다.
 *   2. 사라지는 쪽 영상은 소리만 끄고 페이드가 끝날 때까지 계속 재생한다 (멈추면 화면이 굳어 끊겨 보인다).
 *   3. 새로 나타날 사진·영상의 첫 화면이 준비된 뒤(최대 0.7초) 현재 레이어를 1→0으로 페이드아웃한다.
 *      Web Animations로 돌리므로 합성 스레드에서 처리되어, 영상 디코딩 등으로 바빠도 끊기지 않는다.
 *      레이어를 통째로 투명하게 하지 않고 그 안의 배경색·사진/영상·도형·글자를 하나씩 같이 투명하게 한다.
 *      통째로 하면 매 프레임 사라지는 레이어를 화면 크기 중간 그림으로 한 번 더 그려야 해서, 4K 화면이나
 *      송출 화면 둘에서는 그래픽 칩이 버거워 페이드 중 영상이 멈칫했다 (전환마다 멈칫 약 7회 → 4회).
 *      (페이드 중간에 사라지는 글자 밑으로 사라지는 영상이 살짝 비치는 정도의 차이만 있다)
 *   4. 끝나면 sL ↔ nL 교체, 사라진 레이어의 영상은 멈추거나(곧 다시 쓰면 세워 두고) 한가할 때 정리한다.
 *
 * @param {Object} d - 슬라이드 데이터 (fillL과 동일한 구조)
 */
function applySlide (d) {
  const fd = d.fd || 0  // 페이드 시간(초)

  // 슬라이드 전환 시 이전 클릭재생 핸들러 제거
  _clearClickToPlay()

  // 페이드 중에 배경이 같은 슬라이드가 오면 (예: 배경 컨트롤로 배경을 바꾸는 중에 슬라이드를 넘김)
  // 슬라이드의 페이드 시간(즉시 전환 포함)과 상관없이 배경 페이드는 끊지 않고 이어 간다.
  // 그 밖에는 이전 전환이 아직 진행 중이면 바로 끝낸다
  const keepFade = !!_xf && _xf.sig === _bgSigOf(d)
  if (!keepFade) {
    _fadeAnims.forEach(a => { if (a.cancel) a.cancel() })
    _fadeAnims = []
  }

  // 현재 보이는 레이어와 다음에 쓸 레이어
  const curEl = document.getElementById('L' + sL)
  const nL    = sL === 'A' ? 'B' : 'A'
  const nEl   = document.getElementById('L' + nL)

  if (keepFade) {
    _continueFade(_xf, d, fd)
  } else if (fd > 0) {
    // ── 크로스페이드 모드 ──
    // 다음 슬라이드를 뒤(nEl, opacity=1)에 배치하고 현재 슬라이드(curEl)만 opacity 1→0 으로 페이드아웃
    // — 검정 배경이 비치지 않도록 nEl이 항상 뒤에서 보인다
    // 크로마키 상태는 fillL에서 레이어별로 토글되므로 페이드와 자연스럽게 어우러짐
    const carried = _carryVideo(document.getElementById('M' + sL), document.getElementById('M' + nL), d)
    // 영상을 넘겨준 현재 레이어의 배경색이 페이드 중에 비치지 않게 한다
    if (carried) document.getElementById('BG' + sL).style.backgroundColor = 'transparent'
    // 사라지는 쪽 영상은 소리만 끄고 계속 재생 (페이드가 끝나면 정지). 반복 이어달리기 쌍둥이도 함께
    const outVids = [...curEl.querySelectorAll('video')]
    outVids.forEach(v => { v.muted = true })

    // 새 화면 준비를 기다리는 최대 시간(ms).
    // 배경 컨트롤로 배경만 바꿀 때는 글자가 그대로라 조금 늦어도 괜찮으므로, 새 영상이 화면에 고르게
    // 나올 때까지 더 기다린다 (첫 화면에서 멈춰 보이거나 페이드 중에 뚝뚝 끊기지 않게)
    const READY_WAIT = d.bgTake ? BG_TAKE_WAIT : 700
    const prevGbg = (_gbgLayer && _gbgLayer.active()) ? _gbgLayer.video() : null
    // 숨어 있던 레이어에 남은 지난 글자 복사본(_continueFade)은 지운다
    nEl.querySelectorAll('.xf-ghost').forEach(g => g.remove())
    fillL(nL, d, { carried })
    const gbgVid = _updateGroupBg(d, fd, d.bgTake ? BG_TAKE_WAIT : 0)
    _setUpcoming(d.up)

    nEl.style.transition = 'none'
    nEl.style.opacity    = '1'
    nEl.style.zIndex     = '1'
    curEl.style.transition = 'none'
    curEl.style.opacity    = '1'
    curEl.style.zIndex     = '2'

    let finished = false
    // anims: 페이드가 시작되면 사라지는 레이어의 부분별 애니메이션 (_continueFade가 글자 쪽을 바꿔 끼운다)
    const x = { sig: _bgSigOf(d), nEl, nL, anims: null, textMs: fd * 1000 }
    _xf = x
    const finish = () => {
      if (finished) return
      finished = true
      if (_xf === x) _xf = null
      clearTimeout(safety)
      if (x.anims) { x.anims.forEach(a => { try { a.cancel() } catch (e) {} }) ; x.anims = null }
      // 레이어 역할 교체
      curEl.style.opacity = '0'
      curEl.style.zIndex  = '1'
      nEl.style.opacity   = '1'
      nEl.style.zIndex    = '2'
      sL = nL
      // 사라진 레이어의 영상은 이제 멈춘다 (곧 다시 쓸 영상이면 속도 0으로 세워 둔다)
      _parkOrPause(document.getElementById('M' + curEl.id.slice(1)), outVids)
      // 다음 영상 준비·지나간 영상 정리는 전환이 끝나고 한가할 때 (_standbyBusy)
      _scheduleStandby()
    }
    // 페이드 끝 알림이 오지 않는 경우를 대비한 안전장치
    let safety = setTimeout(finish, READY_WAIT + fd * 1000 + 500)
    // 이어 가는 중에 글자가 더 오래 사라지면 안전장치도 그만큼 늦춘다
    x.extend = ms => {
      clearTimeout(safety)
      safety = setTimeout(finish, READY_WAIT + Math.max(fd * 1000, ms) + 500)
    }
    // 모든 부분이 다 사라지면 끝 (배경과 글자의 페이드 시간이 다를 수 있다)
    x.check = () => {
      if (x.anims && [...x.anims.values()].every(a => a.playState === 'finished')) finish()
    }
    _transitionUntil = performance.now() + READY_WAIT + fd * 1000
    _fadeAnims = [{ cancel: finish }]

    // 새로 나타날 사진·영상의 첫 화면을 기다린 뒤 페이드 (이어 재생하는 영상은 이미 재생 중이라 바로 통과)
    const incoming = [...nEl.querySelectorAll('.ml img, .ml video:not([data-loop-twin])')]
    if (gbgVid && gbgVid !== prevGbg) incoming.push(gbgVid)
    const ready = !window.VideoLoop ? Promise.resolve()
      : (d.bgTake && VideoLoop.whenRolling)
        ? Promise.all(incoming.map(el => el.tagName === 'VIDEO' ? VideoLoop.whenRolling(el, READY_WAIT) : VideoLoop.whenReady([el], READY_WAIT)))
        : VideoLoop.whenReady ? VideoLoop.whenReady(incoming, READY_WAIT) : Promise.resolve()
    ready.then(() => {
      if (finished) return
      // 사라지는 레이어의 배경색·사진/영상·도형·글자를 하나씩 같은 시간에 투명하게 (위 3번 설명)
      // (지난 글자 복사본은 제 페이드대로 사라지게 둔다)
      x.anims = new Map()
      ;[...curEl.children].filter(el => !el.classList.contains('xf-ghost')).forEach(el => {
        const a = el.animate([{ opacity: 1 }, { opacity: 0 }],
          { duration: _isBgPart(el) ? fd * 1000 : x.textMs, easing: 'ease-in-out', fill: 'forwards' })
        a.onfinish = x.check
        x.anims.set(el, a)
      })
    })
  } else {
    // ── 즉시 전환 모드 ──
    document.querySelectorAll('.xf-ghost').forEach(g => g.remove())
    // 바로 앞 슬라이드와 같은 영상이면 멈추거나 되감지 않고 이어서 재생한다
    const curMl = document.getElementById('M' + sL)
    const carried = d.mType === 'video' && !!curMl && curMl.dataset.cacheKey === _mediaKeyOf(d)
    ;['A', 'B'].forEach(l => {
      const ml = document.getElementById('M' + l)
      if (!ml || (carried && l === sL)) return
      ml.querySelectorAll('video').forEach(v => { v.muted = true; v.pause() })
    })
    nEl.style.transition = 'none'
    nEl.style.opacity    = '0'
    nEl.style.zIndex     = '1'
    curEl.style.transition = 'none'
    curEl.style.opacity    = '1'
    curEl.style.zIndex     = '2'
    fillL(sL, d, { carried })
    _updateGroupBg(d, 0)
    _transitionUntil = performance.now() + 300
    _setUpcoming(d.up)
  }

  // 발표자 모드: 반투명 오버레이로 현재/다음 슬라이드 텍스트 표시
  const presOvl = document.getElementById('presOvl')
  if (d.mode === 'pres') {
    presOvl.classList.add('show')
    const _presMainText = d.lyrics || (d.textBoxes||[]).find(b=>b.role==='main')?.text || ''
    document.getElementById('presCur').textContent = _presMainText
    document.getElementById('presNxt').textContent = d.nxt || '(끝)'
  } else {
    presOvl.classList.remove('show')
  }
}

/**
 * PPT 이미지 내보내기용: 슬라이드를 페이드 없이 그린 뒤
 * 폰트·이미지·영상 첫 프레임이 모두 준비될 때까지 기다린다.
 * main.js가 숨김 창에서 executeJavaScript로 호출하고, 반환된 무대 영역을 캡처한다.
 * 송출 화면과 같은 fillL()로 그리므로 글씨 크기·폰트·색이 화면과 똑같이 저장된다.
 */
window.__captureSlide = async function (d) {
  const withTimeout = (p, ms) => Promise.race([p, new Promise(r => setTimeout(r, ms))])

  applySlide(Object.assign({}, d, { fd: 0, mode: null, up: null }))
  const layer = document.getElementById('L' + sL)
  // 정지 화면만 찍으므로 반복 이어달리기(두 번째 영상)는 쓰지 않는다
  if (window.VideoLoop) layer.querySelectorAll('video:not([data-loop-twin])').forEach(v => VideoLoop.detach(v))

  // 슬라이드에 쓰인 폰트를 명시적으로 불러온다 (fonts.ready만으로는 로드가 시작되기 전일 수 있음)
  const families = new Set([d.ff || 'Noto Serif KR'])
  ;(d.textBoxes || []).forEach(b => { if (b && b.fontFamily) families.add(b.fontFamily) })
  await withTimeout(Promise.all([...families].map(f =>
    document.fonts.load(`700 40px '${f}'`, '가A').catch(() => {})
  )), 5000)
  await withTimeout(document.fonts.ready, 5000)

  // 배경 이미지 디코딩 완료 대기
  await withTimeout(Promise.all([...layer.querySelectorAll('img')].map(img =>
    img.decode ? img.decode().catch(() => {}) : Promise.resolve()
  )), 8000)

  // 배경 영상: 첫 프레임이 준비되면 멈춰서 정지 화면으로 캡처
  await withTimeout(Promise.all([...layer.querySelectorAll('video')].map(v => new Promise(res => {
    const done = () => { try { v.pause(); v.currentTime = 0 } catch (e) {} ; res() }
    if (v.readyState >= 2) done()
    else { v.addEventListener('loadeddata', done, { once: true }); v.addEventListener('error', done, { once: true }) }
  }))), 8000)

  // 레이아웃·페인트가 반영되도록 두 프레임 대기 (숨김 창에서 rAF가 멈출 때를 대비한 타임아웃)
  await withTimeout(new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r))), 300)
  await new Promise(r => setTimeout(r, 80))

  const rc = document.getElementById('stage').getBoundingClientRect()
  return { x: Math.round(rc.left), y: Math.round(rc.top), width: Math.round(rc.width), height: Math.round(rc.height) }
}

/*
  IPC 이벤트 수신 등록
  조작창(index.html)에서 보내는 명령을 수신해 화면에 반영한다.
*/
if (window.electronAPI) {
  // 슬라이드 데이터 수신 → 화면 업데이트
  window.electronAPI.onSlideUpdate(applySlide)

  // 블랙아웃 ON/OFF: #blankOvl의 opacity를 1↔0으로 전환
  window.electronAPI.onBlankScreen(on => {
    document.getElementById('blankOvl').style.opacity = on ? '1' : '0'
  })

  // 자동재생 진행 바는 조작창(index.html)에서만 표시하므로 이 화면에서는 무시
  window.electronAPI.onProgressBar(({ action, secs }) => {
    // progress bar는 송출 화면에 표시하지 않음
  })

  // 위치 마커 선: { visible, y } 수신 → 표시/숨김 및 위치 적용
  window.electronAPI.onMarkerLine(({ visible, y }) => {
    _marker = { visible: !!visible, y: (y != null ? y : _marker.y) }
    _placeMarkerLine()
  })

  // 화면 자르기: 조작창의 프로젝터 설정 → { t, r, b, l: 자를 만큼(슬라이드 크기의 %), fit: 줄여 넣기 }
  if (window.electronAPI.onOutputCrop) {
    window.electronAPI.onOutputCrop((c) => {
      _crop = _cleanCrop(c)
      fitStage()
    })
  }

  // 배경 밝기: 편집 창의 배경 컨트롤 → 지금 보이는 배경(사진·영상)에 반영
  //   { v: 밝기(1 = 원래 밝기), dur: 바뀌는 시간(초) } — 슬라이더는 바로, '원래 밝기' 버튼은 dur 동안 부드럽게
  if (window.electronAPI.onBgBrightness) {
    window.electronAPI.onBgBrightness((msg) => {
      const m = (msg && typeof msg === 'object') ? msg : { v: msg }
      const f = _bgFilter(m.v)
      const dur = Math.max(0, Number(m.dur) || 0)
      ;['MA', 'MB', 'GBG'].forEach(id => _setBgFilter(document.getElementById(id), f, dur))
    })
  }

  // 편집 창에서 클릭 → 현재 레이어의 영상 재생 (클릭 시 재생 모드)
  if (window.electronAPI.onVideoPlay) {
    window.electronAPI.onVideoPlay(() => {
      const v = _getOutVid()
      if (v) v.play().catch(() => {})
      _clearClickToPlay()
    })
  }

  // 편집 창 진행 바에서 구간 이동 → 송출 영상도 동일 위치로 이동
  if (window.electronAPI.onVideoSeek) {
    window.electronAPI.onVideoSeek((time) => {
      const v = _getOutVid()
      if (v && v.duration) v.currentTime = time
    })
  }

  // 편집 창에서 영상 일시정지 → 송출 영상도 동일하게 정지
  if (window.electronAPI.onVideoPause) {
    window.electronAPI.onVideoPause(() => {
      const v = _getOutVid()
      if (v) v.pause()
    })
  }

  // 곧 나올 영상 목록: 송출 시작 때와, 슬라이드는 그대로인데 목록이 바뀌었을 때 (배경 컨트롤 칸 미리보기 등)
  // 슬라이드를 바꿀 때는 슬라이드 데이터(up)에 함께 온다. 앞의 몇 개만 한가할 때 하나씩 준비한다
  if (window.electronAPI.onPrewarmMedia) {
    window.electronAPI.onPrewarmMedia(_setUpcoming)
  }

  // 수신 준비가 끝났음을 알린다 → 조작창이 지금 화면을 배경 주소까지 처음부터 다시 보낸다
  // (글꼴 로딩 등으로 이 창이 늦게 준비되면 열 때 보낸 화면을 놓치기 때문)
  if (window.electronAPI.sendScreenReady) window.electronAPI.sendScreenReady()
}
</script>
